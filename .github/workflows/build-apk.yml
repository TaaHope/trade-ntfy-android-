name: Build Trade ntfy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="Trade_Ntfy_Android_Project (1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Expected project ZIP was not found:"
            echo "$ZIP_FILE"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/trade-ntfy-source
          unzip -q "$ZIP_FILE" -d /tmp/trade-ntfy-source

          PROJECT_DIR="$(
            find /tmp/trade-ntfy-source \
              -name settings.gradle.kts \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            echo "ZIP contents:"
            unzip -l "$ZIP_FILE"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          echo "Android project extracted from: $ZIP_FILE"

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Install Firebase configuration
        run: |
          if [ -f google-services.json ]; then
            mkdir -p app
            cp google-services.json app/google-services.json
            echo "Firebase configuration copied."
          else
            echo "No root google-services.json found."
          fi

      - name: Configure Java and Kotlin targets
        shell: bash
        run: |
          set -e

          cat >> app/build.gradle.kts <<'GRADLE'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          GRADLE

          echo "Java and Kotlin targets configured."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-ntfy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
