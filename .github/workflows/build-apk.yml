
name: Build Trade ntfy APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/trade-ntfy-source
          unzip -q "GoldEA_Notify_Android_Project (1).zip" -d /tmp/trade-ntfy-source
          PROJECT_DIR="$(find /tmp/trade-ntfy-source -name settings.gradle.kts -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

      - name: Install Firebase configuration
        run: |
          test -f google-services.json
          mkdir -p app
          cp google-services.json app/google-services.json

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-ntfy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
