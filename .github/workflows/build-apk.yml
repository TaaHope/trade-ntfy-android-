
name: Build Trade ntfy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'GoldEA_Notify_Android_Project*.zip' -print -quit)"
          test -n "$ZIP_FILE" || {
            echo "Android project ZIP not found."
            exit 1
          }

          mkdir -p /tmp/trade-ntfy-source
          unzip -q "$ZIP_FILE" -d /tmp/trade-ntfy-source

          PROJECT_DIR="$(find /tmp/trade-ntfy-source -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR" || {
            echo "settings.gradle.kts not found in ZIP."
            exit 1
          }

          cp -a "$PROJECT_DIR"/. .

      - name: Install Firebase configuration
        run: |
          test -f google-services.json
          mkdir -p app
          cp google-services.json app/google-services.json

      - name: Set Java and Kotlin JVM targets to 17
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("app/build.gradle.kts"),
              Path("build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()
              text = re.sub(
                  r'(?m)(sourceCompatibility|targetCompatibility)\s*=\s*JavaVersion\.VERSION_1_8',
                  r'\1 = JavaVersion.VERSION_17',
                  text
              )
              text = re.sub(
                  r'(?m)(sourceCompatibility|targetCompatibility)\s*=\s*JavaVersion\.VERSION_1_8',
                  r'\1 = JavaVersion.VERSION_17',
                  text
              )
              text = re.sub(
                  r'(?m)(jvmTarget\s*=\s*)"1\.8"',
                  r'\1"17"',
                  text
              )
              text = re.sub(
                  r'(?m)(jvmTarget\.set\(JvmTarget\.)JVM_1_8(\))',
                  r'\1JVM_17\2',
                  text
              )
              path.write_text(text)
              print(f"Checked JVM targets in {path}")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-ntfy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
