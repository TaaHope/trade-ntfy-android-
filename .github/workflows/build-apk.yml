
name: Build Trade ntfy APK

on:
  push:
    paths:
      - 'Trade_Ntfy_Android_Project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project ZIP
        run: |
          test -f Trade_Ntfy_Android_Project.zip
          unzip -t Trade_Ntfy_Android_Project.zip

      - name: Extract Android project
        run: |
          mkdir -p /tmp/trade-ntfy-source
          unzip -q Trade_Ntfy_Android_Project.zip \
            -d /tmp/trade-ntfy-source

          PROJECT_DIR="$(find /tmp/trade-ntfy-source \
            -name settings.gradle.kts \
            -print -quit | xargs -r dirname)"

          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          cp -a "$PROJECT_DIR"/. .

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trade-ntfy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
