
name: Build Trade ntfy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname 'Trade_Ntfy_Android_Project*.zip' \
            -print | sort | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Trade ntfy project ZIP not found in repository root."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          mkdir -p /tmp/trade-ntfy-source
          unzip -q "$ZIP_FILE" -d /tmp/trade-ntfy-source

          PROJECT_DIR="$(find /tmp/trade-ntfy-source \
            -type f -name settings.gradle.kts \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP."
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/tradentfy/app/MainActivity.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-ntfy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
