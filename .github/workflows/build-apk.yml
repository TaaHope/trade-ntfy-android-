
name: Build Trade ntfy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'GoldEA_Notify_Android_Project*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p /tmp/trade-ntfy-source
          unzip -q "$ZIP_FILE" -d /tmp/trade-ntfy-source

          PROJECT_DIR="$(find /tmp/trade-ntfy-source -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP."
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -e
          test -f google-services.json || {
            echo "ERROR: google-services.json is missing from repository root."
            exit 1
          }
          mkdir -p app
          cp google-services.json app/google-services.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-ntfy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
